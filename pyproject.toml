[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exptracker"
version = "0.1.0"
description = "A command-line expense tracker tool"
requires-python = ">=3.8"
dependencies = ["requests"]

[project.scripts]
exptracker = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]